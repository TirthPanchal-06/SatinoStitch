<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout — SATINOSTITCH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Marcellus&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="images/emblem.png">`r`n<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="checkout">
<div id="site-header"></div>
<main>
<div class="wrap page-title"><h1>Checkout</h1></div>
<div class="wrap two" id="checkout">
  <form class="form" id="order-form">
    <h2>Delivery details</h2>
    <div class="field"><label for="o-n">Full name</label><input id="o-n" name="name" required autocomplete="name"></div>
    <div class="field"><label for="o-e">Email</label><input id="o-e" name="email" type="email" required autocomplete="email"></div>
    <div class="field"><label for="o-p">Phone</label><input id="o-p" name="phone" type="tel" pattern="[0-9]{10}" title="10-digit mobile number" required autocomplete="tel"></div>
    <div class="field"><label for="o-pin">PIN code</label><input id="o-pin" name="pin" pattern="[0-9]{6}" title="6-digit PIN code" required autocomplete="postal-code"></div>
    <div class="field full"><label for="o-a">Address</label><input id="o-a" name="address" required autocomplete="street-address"></div>
    <div class="field full"><label for="o-c">City</label><input id="o-c" name="city" required autocomplete="address-level2"></div>
    <h2>Payment</h2>
    <div class="pay full"><label><input type="radio" name="payment" value="upi" checked> UPI</label><label><input type="radio" name="payment" value="card"> Card</label><label><input type="radio" name="payment" value="cod"> Cash on delivery</label></div>
    <button class="btn full">Place order</button>
  </form>
  <aside class="box"><h2>Order summary</h2><div id="order-summary"></div></aside>
</div>
</main>
<div id="site-footer"></div>
<script src="js/app.js"></script>
</body>
</html>
