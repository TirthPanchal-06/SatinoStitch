<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — SATINOSTITCH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Marcellus&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="images/emblem.png">`r`n<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<div id="site-header"></div>
<main>
<div class="narrow">
  <h1>Contact</h1><p class="muted" style="margin:.5rem 0 1.5rem">Questions about sizing, fabric or an order? Write to us.</p>
  <form class="form" id="contact-form" novalidate>
    <div class="field"><label for="c-n">Name</label><input id="c-n" name="name" required autocomplete="name"></div>
    <div class="field"><label for="c-e">Email</label><input id="c-e" name="email" type="email" required autocomplete="email"></div>
    <div class="field full"><label for="c-m">Message</label><textarea id="c-m" name="message" rows="5" required></textarea></div>
    <button class="btn full">Send message</button>
  </form>
</div>
</main>
<div id="site-footer"></div>
<script src="js/app.js"></script>
</body>
</html>
