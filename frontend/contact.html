<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — SATINOSTITCH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Marcellus&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" href="images/emblem.png">
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="contact">
  <div id="site-header"></div>
  <main>
    <div class="wrap page-title" style="padding:3.5rem 0 1rem;text-align:center">
      <span class="hero-pill">Atelier Concierge</span>
      <h1>Contact Our Atelier</h1>
      <p class="muted" style="max-width:550px;margin:0.5rem auto 0">Questions about sizing, custom trousseau drapes or
        order fulfillment? Our concierge is at your service.</p>
    </div>
    <div class="narrow" style="margin-top:2rem">
      <form class="form" id="contact-form" novalidate>
        <div class="field"><label for="c-n">Full Name</label><input id="c-n" name="name" required autocomplete="name"
            placeholder="Meera Kapoor"></div>
        <div class="field"><label for="c-e">Email Address</label><input id="c-e" name="email" type="email" required
            autocomplete="email" placeholder="meera@example.com"></div>
        <div class="field full"><label for="c-m">Message / Couture Inquiry</label><textarea id="c-m" name="message"
            rows="5" required placeholder="Provide your measurements or styling inquiry..."></textarea></div>
        <button class="btn gold full">Send Atelier Message</button>
      </form>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/app.js"></script>
</body>

</html>
